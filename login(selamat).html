<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Design - Success</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* Warna latar belakang luar diubah ke hitam pekat */
            background-color: #000000; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }

        /* Container Utama */
        .main-card {
            width: 95%;
            max-width: 900px;
            aspect-ratio: 16 / 10; 
            
            /* EFEK LATAR BELAKANG GAMBAR & GRADASI PINK */
            /* Silakan ganti 'URL_GAMBAR_KAMU' dengan link gambar yang diinginkan */
            background: 
                linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), 
                url('https://i.pinimg.com/1200x/92/b7/eb/92b7ebf9033459d719753dfc618fe8c9.jpg') no-repeat center;
            background-size: cover;
            
            border: 2px solid #ff85a2; /* Garis seleksi Pink */
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            box-shadow: 0 15px 45px rgba(255, 133, 162, 0.3);
            padding: 40px;
            position: relative;
            overflow: hidden;
        }

        /* Tekstur tambahan agar lebih bergelombang */
        .main-card::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(
                45deg,
                transparent,
                transparent 10px,
                rgba(255, 133, 162, 0.05) 10px,
                rgba(255, 133, 162, 0.05) 20px
            );
            pointer-events: none;
        }

        /* Ikon Centang Pink */
        .icon-container {
            margin-bottom: 30px;
            filter: drop-shadow(0 5px 15px rgba(255, 133, 162, 0.4));
        }

        .badge-shape {
            background-color: #ff85a2; /* Badge jadi warna Pink */
            width: 110px;
            height: 110px;
            display: flex;
            align-items: center;
            justify-content: center;
            clip-path: polygon(50% 0%, 61% 10%, 75% 10%, 80% 24%, 94% 28%, 90% 42%, 98% 54%, 90% 67%, 94% 81%, 80% 85%, 75% 99%, 61% 90%, 50% 100%, 39% 90%, 25% 99%, 20% 85%, 6% 81%, 10% 67%, 2% 54%, 10% 42%, 6% 28%, 20% 24%, 25% 10%, 39% 10%);
        }

        .badge-shape svg {
            width: 55px;
            height: 55px;
            color: #000000; /* Centang hitam agar kontras dengan pink */
        }

        /* Tipografi Serif */
        h1 {
            font-family: 'Playfair Display', serif;
            color: white;
            font-size: 3.5rem;
            font-weight: 900;
            margin-bottom: 5px;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.8);
        }

        p {
            font-family: 'Playfair Display', serif;
            color: #ff85a2; /* Teks deskripsi warna Pink */
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 50px;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.8);
        }

        /* Tombol Pink Cerah */
        .btn-lanjutkan {
            background-color: #ff85a2; 
            color: black;
            border: none;
            width: 100%;
            max-width: 350px;
            padding: 16px 0;
            font-size: 0.8rem;
            font-weight: bold;
            letter-spacing: 2px;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.3s ease;
            border-radius: 4px;
        }

        .btn-lanjutkan:hover {
            background-color: #ff4d79;
            box-shadow: 0 0 20px rgba(255, 133, 162, 0.6);
            transform: scale(1.02);
        }

        /* Responsif Mobile */
        @media (max-width: 600px) {
            h1 { font-size: 2.2rem; }
            p { font-size: 1.3rem; }
            .badge-shape { width: 80px; height: 80px; }
            .badge-shape svg { width: 40px; height: 40px; }
        }
    </style>
</head>
<body>

    <div class="main-card">
        <div class="icon-container">
            <div class="badge-shape">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
            </div>
        </div>

        <h1>Selamat!</h1>
        <p>Anda Berhasil Masuk</p>

        <button class="btn-lanjutkan" onclick="window.location.href='index.html'">LANJUTKAN</button>
    </div>

</body>
</html>
