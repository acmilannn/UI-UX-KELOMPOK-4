<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - 5 Minutes</title>

    <style>
        /* RESET & BASE */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Arial, sans-serif;
        }

        body {
            height: 100vh;
            overflow: hidden;
            background-color: #000;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        /* BAGIAN KIRI - BLACKPINK GRADIENT */
        .left {
            width: 50%;
            background: linear-gradient(180deg, rgba(0,0,0,0.4) 0%, rgba(61, 0, 20, 0.8) 100%), 
                        url('https://i.pinimg.com/736x/77/ec/79/77ec79a594f71cc904856b3caf1abf24.jpg') no-repeat center;
            background-size: cover;
            position: relative;
            display: flex;
            align-items: flex-end;
            padding: 60px;
            border-right: 1px solid rgba(255, 133, 162, 0.3);
        }

        .overlay {
            color: white;
        }

        .overlay h1 {
            font-size: 32px;
            margin-bottom: 10px;
            color: #ff85a2; /* Judul pink */
            text-shadow: 0 0 15px rgba(255, 133, 162, 0.5);
        }

        /* BAGIAN KANAN */
        .right {
            width: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Background gradasi gelap untuk sisi form */
            background: linear-gradient(135deg, #000000 0%, #1a0005 100%);
        }

        .form-box {
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }

        .form-box h2 {
            font-size: 28px;
            margin-bottom: 10px;
            font-weight: 700;
            color: #ffffff;
        }

        .desc {
            font-size: 13px;
            margin-bottom: 25px;
            color: #dfdfdf;
            line-height: 1.4;
        }

        form label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
            color: #ff85a2; /* Label warna pink */
        }

        form input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 133, 162, 0.3);
            background: rgba(255, 255, 255, 0.05);
            border-radius: 6px;
            outline: none;
            color: white;
            transition: 0.3s;
        }

        form input:focus {
            border-color: #ff85a2;
            background: rgba(255, 133, 162, 0.1);
        }

        form button[type="submit"] {
            width: 100%;
            padding: 14px;
            background: #ff85a2; /* Tombol Pink */
            color: black;
            border: none;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s;
        }

        form button[type="submit"]:hover {
            background: #ff4d79;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 133, 162, 0.3);
        }

        /* DIVIDER */
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 25px 0;
            color: #888;
            font-size: 13px;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .divider:not(:empty)::before { margin-right: 15px; }
        .divider:not(:empty)::after { margin-left: 15px; }

        /* SOCIAL BUTTONS */
        .social-container {
            display: flex;
            justify-content: space-between;
            gap: 12px;
        }

        .social-link {
            flex: 1;
            text-decoration: none;
            color: inherit;
        }

        .btn-social {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 15px 5px;
            border: 1px solid rgba(255, 133, 162, 0.2);
            background: rgba(255, 255, 255, 0.03);
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .btn-social:hover {
            background: rgba(255, 133, 162, 0.1);
            border-color: #ff85a2;
            transform: translateY(-2px);
        }

        .btn-social img {
            width: 20px;
            height: 20px;
            object-fit: contain;
            /* Memberikan sedikit filter agar logo terlihat bagus di dark mode */
            filter: brightness(1.1);
        }
        
        /* Khusus logo Apple agar terlihat putih di background gelap */
        .apple-icon {
            filter: invert(1) !important;
        }

        @media (max-width: 768px) {
            .left { display: none; }
            .right { width: 100%; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="left">
        <div class="overlay">
            <h1>Jadilah yang paling tahu.</h1>
            <p>Bergabunglah dengan komunitas kami hari ini.</p>
        </div>
    </div>

    <div class="right">
        <div class="form-box">
            <h2>Masuk atau buat akun</h2>
            <p class="desc">Dengan melanjutkan, Anda menyetujui syarat & kebijakan kami.</p>

            <form action="loginsandi.html" method="POST">
                <label>Alamat Email</label>
                <input type="email" name="email" placeholder="Masukkan email" required>
                
                <button type="submit">LANJUTKAN</button>
            </form>

            <div class="divider">atau lanjut dengan</div>
            
            <div class="social-container">
                <a href="logingoogle.html" class="social-link">
                    <button type="button" class="btn-social">
                        <img src="https://fonts.gstatic.com/s/i/productlogos/googleg/v6/24px.svg" alt="Google">
                        Google   
                    </button>
                </a>
                
                <a href="loginapple.html" class="social-link">
                    <button type="button" class="btn-social">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/f/fa/Apple_logo_black.svg" class="apple-icon" alt="Apple">
                        Apple
                    </button>
                </a>

                <a href="loginfacebook.html" class="social-link">
                    <button type="button" class="btn-social">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/b/b8/2021_Facebook_icon.svg" alt="Facebook">
                        Facebook
                    </button>
                </a>
            </div>
        </div>
    </div>
</div>

</body>
</html>
