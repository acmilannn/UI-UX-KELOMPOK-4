<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pembayaran Berhasil</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0fbfc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .success-card {
            background: white;
            width: 400px;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        /* Animasi Centang */
        .checkmark-wrapper {
            width: 80px;
            height: 80px;
            background-color: #4CAF50;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 20px;
            color: white;
            font-size: 40px;
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.3);
            animation: scaleUp 0.5s ease-out;
        }

        @keyframes scaleUp {
            0% { transform: scale(0); }
            80% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        h2 {
            color: #333;
            margin-bottom: 10px;
        }

        p {
            color: #777;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        /* Detail Transaksi */
        .transaction-details {
            background-color: #f9f9f9;
            border-radius: 8px;
            padding: 20px;
            margin: 25px 0;
            text-align: left;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 0.85rem;
        }

        .label { color: #888; }
        .value { color: #333; font-weight: bold; }

        .divider {
            border-top: 1px dashed #ddd;
            margin: 10px 0;
        }

        /* Tombol */
        .btn-dashboard {
            display: block;
            background-color: #118ee9;
            color: white;
            text-decoration: none;
            padding: 15px;
            border-radius: 8px;
            font-weight: bold;
            transition: background 0.3s;
        }

        .btn-dashboard:hover {
            background-color: #0d79c6;
        }

        .order-id {
            font-size: 0.75rem;
            color: #bbb;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="success-card">
    <div class="checkmark-wrapper">
        ✓
    </div>
    
    <h2>Pembayaran Berhasil!</h2>
    <p>Terima kasih! Langganan Anda sekarang sudah aktif. Selamat menikmati akses digital tanpa batas.</p>

    <div class="transaction-details">
        <div class="detail-row">
            <span class="label">Metode Pembayaran</span>
            <span class="value">DANA</span>
        </div>
        <div class="detail-row">
            <span class="label">Paket</span>
            <span class="value">Akses Digital Tahunan</span>
        </div>
        <div class="divider"></div>
        <div class="detail-row">
            <span class="label">Total Bayar</span>
            <span class="value">Rp50.000</span>
        </div>
        <div class="detail-row">
            <span class="label">Status</span>
            <span class="value" style="color: #4CAF50;">Sukses</span>
        </div>
    </div>

    <a href="dashboard.html" class="btn-dashboard">MULAI MEMBACA</a>

    <div class="order-id">ID Transaksi: #5MIN-9928374</div>
</div>

</body>
</html>
