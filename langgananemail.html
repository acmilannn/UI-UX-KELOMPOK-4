<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendaftaran - 5 Minutes</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Playfair+Display:wght@900&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #0d0d0d; /* Latar belakang luar diubah ke Hitam Gelap */
            margin: 0;
            color: #ffffff; /* Teks utama jadi Putih */
        }

        /* HEADER & STEPPER */
        header {
            background: #1a1a1a; /* Header jadi Hitam sedikit lebih terang */
            padding: 30px 0;
            text-align: center;
            border-bottom: 1px solid #333;
        }

        .logo {
            width: 150px;
            margin-bottom: 30px;
            /* Memberikan efek filter agar logo terlihat lebih menyatu dengan tema gelap jika perlu */
        }

        .stepper {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .step {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #ffffff;
        }

        .step.inactive { color: #666; }

        .step-number {
            background: #333;
            color: #ffffff;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        /* Warna Step Active diubah menjadi Pink */
        .step.active .step-number { 
            background: #ff85a2; 
            color: #000;
        }

        .line {
            width: 150px;
            height: 1px;
            background: #333;
        }

        /* MAIN CONTENT AREA */
        .container {
            max-width: 1000px;
            margin: 50px auto;
            display: grid;
            grid-template-columns: 1.8fr 1fr;
            gap: 30px;
            padding: 0 20px;
        }

        /* LEFT SIDE: INPUT EMAIL */
        .card-left {
            background: #1a1a1a; /* Card diubah menjadi Hitam */
            padding: 50px;
            box-shadow: 0 4px 20px rgba(255, 133, 162, 0.1);
            border: 1px solid #333;
        }

        .card-left h2 {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            margin-bottom: 30px;
            color: #ffffff;
        }

        .input-group {
            margin-bottom: 25px;
        }

        .input-group input {
            width: 100%;
            padding: 15px;
            border: 1px solid #ff85a2; /* Border input jadi Pink */
            background: #0d0d0d;
            color: white;
            font-size: 16px;
            outline: none;
        }

        .checkbox-group {
            display: flex;
            align-items: flex-start;
            gap: 15px;
            margin-bottom: 20px;
            font-size: 13px;
            line-height: 1.5;
            color: #cccccc;
        }

        .checkbox-group input {
            accent-color: #ff85a2; /* Warna centang checkbox jadi Pink */
            width: 20px;
            height: 20px;
            margin-top: 3px;
            cursor: pointer;
        }

        /* RIGHT SIDE: SUMMARY */
        .card-right {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .summary-box {
            background: #1a1a1a; /* Summary box jadi Hitam */
            padding: 30px;
            box-shadow: 0 4px 20px rgba(255, 133, 162, 0.1);
            border: 1px solid #333;
        }

        .summary-box h3 {
            font-size: 18px;
            font-weight: 900;
            line-height: 1.3;
            margin-bottom: 15px;
            color: #ffffff;
        }

        .price-info {
            font-size: 14px;
            margin-bottom: 10px;
        }

        .price-info span.old-price {
            text-decoration: line-through;
            color: #666;
            margin-right: 5px;
        }

        .price-info span.current-price {
            font-weight: bold;
            color: #ff85a2; /* Harga saat ini jadi Pink */
        }

        .cancel-info {
            font-size: 12px;
            color: #888;
        }

        /* Tombol LANJUTKAN diubah menjadi Pink */
        .btn-lanjutkan {
            background: #ff85a2; 
            color: #000;
            border: none;
            padding: 18px;
            width: 100%;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-lanjutkan:hover {
            background: #ff4d79;
            box-shadow: 0 0 15px rgba(255, 133, 162, 0.4);
        }
    </style>
</head>
<body>

    <header>
        <img src="5menit.png" alt="5 Minutes Logo" class="logo">
        <div class="stepper">
            </div>
        </div>
    </header>

    <main class="container">
        <div class="card-left">
            <h2>Masukkan Alamat Email</h2>
            <div class="input-group">
                <input type="email" placeholder="Email" id="emailInput">
            </div>
            
            <div class="checkbox-group">
                <input type="checkbox" checked>
                <label>Daftar untuk buletin Harian 5 minutes, cerita terbaik kami yang dikirim melalui email langsung ke kotak masuk anda.</label>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" checked>
                <label>Dengan melanjutkan, email anda dapat digunakan untuk tujuan pemasaran terkait akun, sesuai dengan kebijakan privasi kami dan hukum yang berlaku.</label>
            </div>
        </div>

        <div class="card-right">
            <div class="summary-box">
                <h3>Akses Digital Tahunan (diperbarui secara otomatis)</h3>
                <div class="price-info">
                    <span class="old-price">RP.50.000</span>
                    <span class="current-price">RP.0</span>
                </div>
                <p class="cancel-info">Batalkan kapan saja</p>
            </div>

            <a href="langgananpembayaran.html">
                <button class="btn-lanjutkan">LANJUTKAN</button>
                </a>
        </div>
    </main>

    <script>
        function validateAndProceed() {
            const email = document.getElementById('emailInput').value;
            if (email.trim() === "" || !email.includes('@')) {
                alert("Silakan masukkan alamat email yang valid.");
            } else {
                alert("Email diterima. Melanjutkan ke Tahap 2: Tambahkan Detail.");
                // window.location.href = "pembayaran_detail.html";
            }
        }
    </script>

</body>
</html>
