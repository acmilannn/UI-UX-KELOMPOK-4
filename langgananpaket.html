<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Langganan - 5 Minutes</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Playfair+Display:wght@900&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #0d0d0d; /* Latar belakang luar Hitam */
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 40px 0;
        }

        .subscription-container {
            background: #1a1a1a; /* Container dalam Hitam sedikit terang */
            width: 100%;
            max-width: 800px;
            padding-bottom: 50px;
            box-shadow: 0 10px 40px rgba(255, 133, 162, 0.15);
            text-align: center;
            border: 1px solid #333;
        }

        /* Hero Banner */
        .hero-banner {
            /* Background Banner menggunakan gradasi Hitam ke Pink Gelap */
            background: linear-gradient(rgba(0, 0, 0, 0.8), rgba(255, 133, 162, 0.2)), url('smoke-bg.jpg');
            background-color: #000;
            color: white;
            padding: 40px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 30px;
            border-bottom: 1px solid #ff85a2;
        }

        .hero-text {
            text-align: left;
            max-width: 300px;
        }

        .hero-text h2 {
            font-size: 18px;
            font-weight: 900;
            line-height: 1.4;
        }

        /* Pricing Cards */
        .plans-wrapper {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 60px 20px 40px;
            position: relative;
        }

        .plan-card {
            border: 1px solid #333; /* Border default gelap */
            padding: 30px;
            width: 280px;
            text-align: left;
            cursor: pointer;
            transition: 0.3s;
            position: relative;
            background: #111; /* Card background hitam */
            color: white;
        }

        .plan-card.active {
            border: 2px solid #ff85a2; /* Border aktif jadi Pink */
            box-shadow: 0 5px 15px rgba(255, 133, 162, 0.2);
            background: #1a1a1a;
        }

        .badge-popular {
            position: absolute;
            top: -15px;
            right: 20px;
            background: #ff85a2; /* Badge jadi Pink */
            color: black;
            padding: 5px 15px;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .radio-circle {
            width: 24px;
            height: 24px;
            border: 2px solid #444;
            border-radius: 50%;
            display: inline-block;
            vertical-align: middle;
            margin-right: 10px;
            position: relative;
        }

        .active .radio-circle {
            border-color: #ff85a2;
            background: #ff85a2;
        }

        .active .radio-circle::after {
            content: '';
            width: 10px;
            height: 10px;
            background: black;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .plan-title {
            font-weight: 900;
            font-size: 16px;
            display: inline-block;
            vertical-align: middle;
            color: #ffffff;
        }

        .price-text {
            font-size: 20px;
            font-weight: 900;
            margin: 15px 0 10px 38px;
            color: #ff85a2; /* Harga jadi Pink */
        }

        .promo-text {
            font-weight: 900;
            color: #ffffff;
            margin: 0 0 10px 38px;
        }

        .cancel-text {
            font-size: 13px;
            color: #888;
            margin-left: 38px;
        }

        /* Footer & Button */
        .payment-methods {
            font-size: 14px;
            color: #aaa;
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }

        .btn-checkout {
            background: #ff85a2; /* Tombol Pink */
            color: black;
            border: none;
            padding: 15px 60px;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-checkout:hover {
            background: #ff4d79;
            box-shadow: 0 5px 15px rgba(255, 133, 162, 0.4);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

<div class="subscription-container">
    <div class="hero-banner">
        <div class="hero-text">
            <h2>Jadilah yang paling tahu. Bergabunglah dengan komunitas pembaca eksklusif kami hari ini.</h2>
        </div>
        <div class="logo">
            <img src="5menit.png" alt="5 Minutes" width="150">
        </div>
    </div>

    <div class="plans-wrapper">
        <div class="plan-card active" onclick="selectPlan(this, 'Tahunan')">
            <div class="badge-popular">PALING POPULER</div>
            <div class="radio-circle"></div>
            <span class="plan-title">Akses Digital Tahunan</span>
            <div class="price-text">Rp.25,000/bulan</div>
            <div class="promo-text">Gratis 1 bulan</div>
            <div class="cancel-text">Batalkan kapan saja</div>
        </div>

        <div class="plan-card" onclick="selectPlan(this, 'Mingguan')">
            <div class="radio-circle"></div>
            <span class="plan-title">Akses Digital 4 minggu</span>
            <div class="price-text">Rp.6,250/minggu</div>
            <div class="cancel-text" style="margin-top: 40px;">Batalkan kapan saja</div>
        </div>
    </div>

    <div class="payment-methods">
        <span>💳 Dompet Digital</span>
        <span>⌨️ Kartu kredit/debit</span>
    </div>
    <a href="langgananemail.html">
        <button class="btn-checkout">DAPATKAN AKSES DIGITAL</button>
    </a>
</div>

<script>
    let selectedPlan = "Tahunan";

    function selectPlan(element, planName) {
        const cards = document.querySelectorAll('.plan-card');
        cards.forEach(card => card.classList.remove('active'));

        element.classList.add('active');
        selectedPlan = planName;
        console.log("Paket dipilih: " + selectedPlan);
    }

    function confirmPayment() {
        alert("Terima kasih! Anda memilih paket: " + selectedPlan + "\nMengarahkan Anda ke halaman pembayaran...");
    }
</script>

</body>
</html>
